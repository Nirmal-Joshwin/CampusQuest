name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit
          
      - name: Security scan (Bandit)
        run: |
          cd backend
          bandit -r app
          
      - name: Run Backend Tests
        run: |
          cd backend
          python test_api.py
          python test_gameplay.py
          python test_security.py
          python test_multiplayer.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Run Dependency Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true # Will be fixed in future via dependabot. Ignored here due to known node-forge via Expo
          
      - name: TypeScript Check
        run: |
          cd frontend
          npm run typecheck
          
      - name: Run Frontend Tests
        run: |
          cd frontend
          npx jest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
